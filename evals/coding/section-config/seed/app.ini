    db2.qa.example.internal:5432
    db3.qa.example.internal:5432
pool_size          = 5
timeout            = 30
lag_alert_seconds  = 120

[qa.cache]
backend=memcached
servers=
    cache1.qa.example.internal:11211
    cache2.qa.example.internal:11211
