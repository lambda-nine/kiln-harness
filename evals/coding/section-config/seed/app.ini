timeout=30
namespace=app-qa

[qa.web]
listen = 0.0.0.0:8080
workers = 4
timeout = 30
allowed_origins =
    https://qa.example.internal
    https://www.qa.example.internal
    https://admin.qa.example.internal
upstream = qa.api
gzip = on
log_level = info
