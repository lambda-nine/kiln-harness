min_version        = 1.2
ciphers            =
    TLS_AES_128_GCM_SHA256
    TLS_AES_256_GCM_SHA384
    TLS_CHACHA20_POLY1305_SHA256

[qa.api]
listen=0.0.0.0:9000
timeout=30
connect_timeout=30
rate_limit=100
retries=3
log_level=info
routes=
    /v1/orders
    /v1/users
    /v1/search
upstream=qa.db

[qa.queue]
# Owner: web team. Last reviewed January 2026.
broker = amqp://mq.qa.example.internal:5672
prefetch = 50
timeout = 30
queues =
    orders
    emails
    reports

[qa.worker]
concurrency        = 8
timeout            = 300
on_start           =
    migrate --check
    warm-cache
