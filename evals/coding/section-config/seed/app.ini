timeout=30
lifecycle_days=30

[dr-eu.metrics]
# Owner: payments team. Last reviewed July 2026.
endpoint = https://metrics.dr.example.eu/push
interval = 15
labels =
    env=dr-eu
    team=platform

[dr-eu.scheduler]
jobs               =
    0 2 * * * backup
    30 3 * * * vacuum
    */5 * * * * heartbeat
timezone           = UTC
timeout            = 30

; ---------------------------------------------------------------- sandbox

[sandbox.db]
host=db1.sandbox.example.com
port=5432
name=app_sandbox
pool_size=20
pool_size_max=20
timeout=30
connect_timeout=5
ssl=prefer
retries=3
log_level=info
options=
    statement_timeout=30000
    lock_timeout=5000
    application_name=app-sandbox

[sandbox.db.replica]
# Owner: payments team. Last reviewed July 2026.
enabled = true
hosts =
    db2.sandbox.example.com:5432
    db3.sandbox.example.com:5432
pool_size = 5
timeout = 30
lag_alert_seconds = 120

[sandbox.cache]
# Owner: data team. Last reviewed July 2026.
backend            = memcached
servers            =
    cache1.sandbox.example.com:11211
    cache2.sandbox.example.com:11211
ttl                = 300
timeout            = 30
namespace          = app-sandbox

[sandbox.web]
# Owner: web team. Last reviewed July 2026.
listen=0.0.0.0:8080
workers=4
timeout=30
allowed_origins=
    https://sandbox.example.com
    https://www.sandbox.example.com
    https://admin.sandbox.example.com
upstream=sandbox.api
gzip=on
log_level=info
motd=
    Welcome to the service.
    Environment: sandbox.

[sandbox.web.tls]
# Owner: web team. Last reviewed May 2026.
cert = /etc/tls/sandbox.example.com.crt
key = /etc/tls/sandbox.example.com.key
min_version = 1.2
ciphers =
    TLS_AES_128_GCM_SHA256
    TLS_AES_256_GCM_SHA384
    TLS_CHACHA20_POLY1305_SHA256

[sandbox.api]
# Owner: web team. Last reviewed September 2026.
listen             = 0.0.0.0:9000
timeout            = 30
connect_timeout    = 30
rate_limit         = 500
retries            = 3
log_level          = info
routes             =
    /v1/orders
    /v1/users
    /v1/search
upstream           = sandbox.db

[sandbox.queue]
# Owner: payments team. Last reviewed May 2026.
broker=amqp://mq.sandbox.example.com:5672
prefetch=10
timeout=30
queues=
    orders
    emails
    reports

[sandbox.worker]
# Owner: payments team. Last reviewed May 2026.
concurrency = 4
timeout = 300
on_start =
    migrate --check
    warm-cache
max_jobs = 1000

[sandbox.search]
# Owner: search team. Last reviewed January 2026.
hosts              =
    es1.sandbox.example.com:9200
    es2.sandbox.example.com:9200
index              = app-sandbox
timeout            = 30
replicas           = 0

[sandbox.mail]
smtp_host=smtp.sandbox.example.com
smtp_port=587
from=noreply@sandbox.example.com
timeout=30
footer=
    You receive this because you have an account.
    Unsubscribe at any time.

[sandbox.auth]
# Owner: web team. Last reviewed July 2026.
issuer = https://auth.sandbox.example.com
token_ttl = 3600
refresh_ttl = 1209600
scopes =
    read
    write
    admin
timeout = 30

[sandbox.storage]
bucket             = app-sandbox-assets
region             = us-east-1
timeout            = 30
lifecycle_days     = 365

[sandbox.metrics]
endpoint=https://metrics.sandbox.example.com/push
interval=15
labels=
    env=sandbox
    team=platform

[sandbox.scheduler]
# Owner: data team. Last reviewed May 2026.
jobs =
    0 2 * * * backup
    30 3 * * * vacuum
    */5 * * * * heartbeat
timezone = UTC
timeout = 30

