# app.ini: settings for every environment.
#
# A section starts with a [name] line and runs to the next one. A setting
# is key = value. A line that starts with spaces continues the value of the
# setting above it, one item per line. Lines that start with # or ; are
# comments.

; ---------------------------------------------------------------- prod

[prod.db]
# Owner: search team. Last reviewed September 2026.
host               = db1.example.com
port               = 5432
name               = app_prod
# pool_size = 20 was too small during the spring sale; see INC-2231.
pool_size          = 25
pool_size_max      = 60
timeout            = 30
connect_timeout    = 5
ssl                = require
retries            = 3
log_level          = warn
options            =
    statement_timeout=30000
    lock_timeout=5000
    application_name=app-prod

[prod.db.replica]
enabled=true
hosts=
    db2.example.com:5432
    db3.example.com:5432
    db4.example.com:5432
pool_size=15
timeout=30
lag_alert_seconds=120

[prod.cache]
# Owner: data team. Last reviewed July 2026.
backend = memcached
servers =
    cache1.example.com:11211
    cache2.example.com:11211
    cache3.example.com:11211
ttl = 300
timeout = 30
namespace = app-prod

[prod.web]
# Owner: data team. Last reviewed July 2026.
listen             = 0.0.0.0:8080
workers            = 16
timeout            = 30
allowed_origins    =
    https://example.com
    https://www.example.com
    https://admin.example.com
upstream           = prod.api
gzip               = on
log_level          = warn
motd               =
    Welcome to the service.
    Environment: prod.

[prod.web.tls]
cert=/etc/tls/example.com.crt
key=/etc/tls/example.com.key
min_version=1.2
ciphers=
    TLS_AES_128_GCM_SHA256
    TLS_AES_256_GCM_SHA384
    TLS_CHACHA20_POLY1305_SHA256

[prod.api]
# Owner: payments team. Last reviewed September 2026.
listen = 0.0.0.0:9000
timeout = 30
connect_timeout = 30
rate_limit = 500
retries = 3
log_level = warn
routes =
    /v1/orders
    /v1/users
    /v1/search
upstream = prod.db

[prod.queue]
broker             = amqp://mq.example.com:5672
prefetch           = 20
timeout            = 30
queues             =
    orders
    emails
    reports

[prod.worker]
# Owner: web team. Last reviewed March 2026.
concurrency=2
timeout=300
on_start=
    migrate --check
    warm-cache
max_jobs=1000

[prod.search]
# Owner: identity team. Last reviewed September 2026.
hosts =
    es1.example.com:9200
    es2.example.com:9200
index = app-prod
timeout = 30
replicas = 2

[prod.mail]
# Owner: web team. Last reviewed March 2026.
smtp_host          = smtp.example.com
smtp_port          = 587
from               = noreply@example.com
timeout            = 30
footer             =
    You receive this because you have an account.
    Unsubscribe at any time.

[prod.auth]
# Owner: payments team. Last reviewed May 2026.
issuer=https://auth.example.com
token_ttl=3600
refresh_ttl=1209600
scopes=
    read
    write
    admin
timeout=30

[prod.storage]
bucket = app-prod-assets
region = us-east-1
timeout = 30
lifecycle_days = 365

[prod.metrics]
# Owner: data team. Last reviewed September 2026.
endpoint           = https://metrics.example.com/push
interval           = 15
labels             =
    env=prod
    team=platform

[prod.scheduler]
jobs=
    0 2 * * * backup
    30 3 * * * vacuum
    */5 * * * * heartbeat
timezone=UTC
timeout=30

