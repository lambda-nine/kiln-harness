[package]
name = "kiln-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
